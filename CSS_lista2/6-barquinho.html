<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      height: 100vh;
      background: linear-gradient(to bottom, #cceeff 0%, #b0e0e6 60%, #ffffff 100%);
      position: relative;
    }

    /* Nuvem Emoji */
    .nuvem {
      position: absolute;
      top: 40px;
      left: -100px;
      font-size: 80px;
      animation: moverNuvem 20s linear infinite;
    }

    @keyframes moverNuvem {
      from { left: -100px; }
      to { left: 100vw; }
    }

    /* Barquinho Emoji */
    .barco {
      position: absolute;
      bottom: 110px;
      left: -100px;
      font-size: 90px;
      z-index: 10;
      animation: navegar 15s linear infinite, balanco 2s ease-in-out infinite alternate;
    }

    @keyframes navegar {
      from { left: -100px; }
      to { left: 100vw; }
    }

    @keyframes balanco {
      from { transform: rotate(-6deg) translateY(0); }
      to { transform: rotate(6deg) translateY(-10px); }
    }

    /* Mar de Emojis */
    .mar {
      position: absolute;
      bottom: 0;
      width: 100vw;
      height: 120px;
      background-color: #3ba0ff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      font-size: 50px;
      overflow: hidden;
      white-space: nowrap;
    }

    .onda {
      display: inline-block;
      animation: onda 1.5s ease-in-out infinite alternate;
    }

    @keyframes onda {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div class="nuvem">☁️</div>

  <div class="barco">⛵</div>

  <div class="mar">
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
    <span class="onda">🌊</span>
  </div>

</body>
</html>
