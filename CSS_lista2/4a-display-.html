<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body { margin: 0; }
    div {
      display: block;
      height: 100px;
      text-align: center;
      line-height: 100px;
    }
    .b1 { background-color: rgb(131, 28, 190); }
    .b2 { background-color: rgb(7, 145, 30); }
    .b3 { background-color: red; }
    .b4 { background-color: rgb(253, 228, 4); }
  </style>
</head>
<body>
  <div class="b1">1</div>
  <div class="b2">2</div>
  <div class="b3">3</div>
  <div class="b4">4</div>
</body>
</html>
<!--display: block faz com que cada elemento ocupe o espaço disponivel-->
