<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
    }
    div {
      position: absolute;
      width: 100px;
      height: 100px;
      color: black;
      font-size: 12px;
      padding: 2px;
    }
    .box1 { background-color: red; top: 0; left: 0; }
    .box2 { background-color: rgb(250, 234, 6); top: 0; right: 0; }
    .box3 { background-color: rgb(2, 173, 2); bottom: 0; right: 0; }
    .box4 { background-color: blue; bottom: 0; left: 0; }
    .box5 {
      background-color: rgb(190, 1, 190);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="box1">box1</div>
  <div class="box2">box2</div>
  <div class="box3">box3</div>
  <div class="box4">box4</div>
  <div class="box5">box5</div>
</body>
</html>
<!--position: absolute força os elementos a se basear no top/left/right/bottom da tela-->
