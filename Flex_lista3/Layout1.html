<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fffdfd;
    }

    .card {
      width: 320px;
      height: 580px;
      background-color: #ffffff;
      border: 2px solid #2a2a2b;
      border-radius: 12px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      color: lab(65.87% 0 -0.01 / 0.993);
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .bar-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: auto;
    }

    .bar {
      width: 100%;
      height: 24px;
      background-color: #e8e8e8;
      border-radius: 4px;
    }

    .circle {
      width: 60px;
      height: 60px;
      background-color: #e8e8e8;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .small-bar {
      width: 90px;
      height: 24px;
      background-color: #e8e8e8;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Company Logo</div>

    <div class="bar-group">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="circle"></div>
    <div class="small-bar"></div>
  </div>

</body>
</html>
