<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    header, footer {
      background-color: #92c42e;
      padding: 20px;
      height: 100px;
    }

    .main-container {
      display: flex;
      flex: 1;
    }

    article {
      flex: 3;
      background-color: #ffffff;
      padding: 20px;
    }

    aside {
      flex: 1;
      background-color: #eaf5dc;
      padding: 20px;
    }

    nav {
      flex: 1;
      background-color: #bdceb7;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>Header</header>

  <div class="main-container">
    <article>Article</article>
    <aside>Aside</aside>
    <nav>Nav</nav>
  </div>

  <footer>Footer</footer>

</body>
</html>
