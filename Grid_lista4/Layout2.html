<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
      background-color: #ffffff;
      font-family: serif;
    }

    .top-row {
      display: flex;
      gap: 15px;
      height: 35vh;
    }

    .box-a {
      background-color: #444444;
      color: #ffffff;
      flex: 2;
      padding: 15px;
      border-radius: 8px;
    }

    .box-b {
      background-color: #444444;
      color: #ffffff;
      flex: 1;
      padding: 15px;
      border-radius: 8px;
    }

    .bottom-row {
      display: flex;
      gap: 15px;
      flex: 1;
    }

    .box-c {
      background-color: #444444;
      color: #ffffff;
      width: 30vw;
      padding: 15px;
      border-radius: 8px;
    }

    .wrapper-grid {
      background-color: #444444;
      flex: 1;
      padding: 15px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
    }

    .inner-box {
      background-color: #cccccc;
      color: #333333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <div class="top-row">
    <div class="box-a">A</div>
    <div class="box-b">B</div>
  </div>

  <div class="bottom-row">
    <div class="box-c">C</div>
    
    <div class="wrapper-grid">
      <div class="inner-box">E</div>
      <div class="inner-box">F</div>
      <div class="inner-box">G</div>
      <div class="inner-box">M</div>
      <div class="inner-box">I</div>
      <div class="inner-box">J</div>
    </div>
  </div>

</body>
</html>
