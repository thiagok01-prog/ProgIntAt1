<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #d8336d;
      height: 80px;
    }

    .main-container {
      display: flex;
      flex: 1;
    }

    nav {
      background-color: #b5b078;
      width: 200px;
    }

    main {
      background-color: #e5a373;
      flex: 1;
    }

    footer {
      background-color: #53a38b;
      height: 60px;
    }
  </style>
</head>
<body>

  <header>Header</header>

  <div class="main-container">
    <nav>Nav</nav>
    <main>Content</main>
  </div>

  <footer>Footer</footer>

</body>
</html>
