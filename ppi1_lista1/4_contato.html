<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>Document</title>
</head>
<body>

<p><a href="4_curriculo.html">Voltar para o Currículo</a></p>
<p>Preencha os campos abaixo para enviar sua mensagem (* obrigatório).</p>

<form>
  <label for="nome">Nome *</label><br>
  <input type="text" id="nome" name="nome" placeholder="Seu nome" required><br><br>

  <label for="email">E-mail *</label><br>
  <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required><br><br>

  <label for="assunto">Assunto</label><br>
  <input type="text" id="assunto" name="assunto" placeholder="Motivo do contato"><br><br>

  <label for="estado">Estado</label><br>
  <select id="estado" name="estado">
    <option value="" disabled selected>Selecione</option>
    <option value="AC">AC</option>
    <option value="AL">AL</option>
    <option value="AP">AP</option>
    <option value="AM">AM</option>
    <option value="BA">BA</option>
    <option value="CE">CE</option>
    <option value="DF">DF</option>
    <option value="ES">ES</option>
    <option value="GO">GO</option>
    <option value="MA">MA</option>
    <option value="MT">MT</option>
    <option value="MS">MS</option>
    <option value="MG">MG</option>
    <option value="PA">PA</option>
    <option value="PB">PB</option>
    <option value="PR">PR</option>
    <option value="PE">PE</option>
    <option value="PI">PI</option>
    <option value="RJ">RJ</option>
    <option value="RN">RN</option>
    <option value="RS">RS</option>
    <option value="RO">RO</option>
    <option value="RR">RR</option>
    <option value="SC">SC</option>
    <option value="SP">SP</option>
    <option value="SE">SE</option>
    <option value="TO">TO</option>
  </select><br><br>

  <label for="mensagem">Mensagem</label><br>
  <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem..."></textarea><br><br>

  <button type="submit">Enviar</button>
</form>
