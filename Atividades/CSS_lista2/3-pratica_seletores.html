<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    .p1 {
      font-family: Arial, sans-serif;
      color: #205d9b;
    }
    .p1 span {
      color: #fd8f29;
      font-weight: bold;
    }

    .p2 {
      font-family: 'Georgia', serif;
      color: #0a634d;
    }
    .p2 span {
      background-color: #12b685;
      font-style: italic;
    }

    .p3 {
      font-family: 'Courier New', monospace;
      color: #9d0abb;
    }
    .p3 span {
      color: #1f1e1e;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Exemplo de Estilos</h1>

  <p class="p1">
    blah <span>blah</span> blah
  </p>

  <p class="p2">
    blah <span>blah</span> blah
  </p>

  <p class="p3">
    blah <span>blah</span> blah
  </p>

</body>
</html>
