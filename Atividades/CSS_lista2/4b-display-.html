<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body { margin: 0; }
    .container { font-size: 0; } /* Remove espaçamento entre elementos inline */
    div {
      display: inline-block;
      width: 25%;
      height: 150px;
      font-size: 16px;
      text-align: center;
      line-height: 150px;
    }
    .b1 { background-color: rgb(138, 30, 240); }
    .b2 { background-color: rgb(4, 126, 14); }
    .b3 { background-color: red; }
    .b4 { background-color: rgb(253, 249, 6); }
  </style>
</head>
<body>
  <div class="container">
    <div class="b1">1</div><div class="b2">2</div><div class="b3">3</div><div class="b4">4</div>
  </div>
</body>
</html>
<!--Display: inline-block permite ajustar altura, largura e posição dos elementos para ficar lado a lado na mesma linha.-->
