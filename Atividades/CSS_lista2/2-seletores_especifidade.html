<!DOCTYPE html>
<head>   
   <title>Document</title>
   <style>
      /*regra 1*/ li{color:red;}
      /*regra 2*/ .churras{color:green;}
      /*regra 3*/ .fruta{color:gray}
      /*regra 4*/ li+li.churras{color: black;}
      /*regra 5*/ .churras[draggable="true"]{color: magenta;}
      /*regra 6*/ #lip1,#lip2,#lip3{color:blue}
      /*regra 7*/ #lip3.fruta{color:orange}
      /*regra 8*/ ol>li.churras#lip5{color:purple}
   </style>
</head>
<body>   
   <ol>
   <!--item 1--> <li id="lip0">Abacaxi</li>
   <!--item 2--> <li           class="fruta">Melão</li>
   <!--item 3--> <li id="lip2" class="fruta">Pera</li>
   <!--item 4--> <li id="lip3" class="fruta">Uva</li>
   <!--item 5--> <li id="lip4" class="fruta">Maçã</li>
   <!--item 6--> <li           class="churras">Carne</li>
   <!--item 7--> <li           class="churras">Linguiça</li>
   <!--item 8--> <li id="lip7" class="churras" draggable="true">Pão de alho</li>
   </ol>   
</body>
</html>

<!--Respostas:
    item 1, somente regra 1 afeta este elemento ja que é o único lip0.
    item 2, somente regra 3 afeta este elemento, por ser mais expecifico comparado a regra 1.
    item 3, somente regra 6 afeta este elemento, porque regra 6 possui especificidade com valor na coluna de ID.
    item 4, somente regra 7 afeta este elemento, regra 7 combina a classe .fruta e lip3.
    item 5, somente regra 3 afeta este elemento, lip4 não foi incluido em nenhuma regra com ID.
    item 6, somente regra 4 afeta este elemento, pois regra 4 é mais expecifica pedindo li+churras.
    item 7, somente regra 4 afeta este elemento, mesma razão que item 6.
    item 8, somente regra 5 afeta este elemento, pois foi o mais expecifico pedindo churras e draggable.-->
