<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.5fr 0.4fr;
      grid-template-rows: 100px 100px 70px;
      gap: 12px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 650px;
    }

    .block-1 {
      background-color: #f39c12;
      grid-column: 1;
      grid-row: 1;
      border-radius: 4px;
    }

    .block-2 {
      background-color: #b0c4de;
      grid-column: 1;
      grid-row: 2;
      border-radius: 4px;
    }

    .block-4 {
      background-color: #f5b7b1;
      grid-column: 2;
      grid-row: 1 / span 2;
      border-radius: 4px;
    }

    .block-5 {
      background-color: #d1e8e2;
      grid-column: 3 / span 2;
      grid-row: 1;
      border-radius: 4px;
    }

    .block-6 {
      background-color: #a8c66c;
      grid-column: 3;
      grid-row: 2 / span 2;
      border-radius: 4px;
    }

    .block-3 {
      background-color: #f4b41a;
      grid-column: 1 / span 2;
      grid-row: 3;
      border-radius: 4px;
    }

    .circles-container {
      grid-column: 4;
      grid-row: 2 / span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    .circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .c1 { background-color: #e77647; }
    .c2 { background-color: #cca2a6; }
    .c3 { background-color: #b2c294; }
    .c4 { background-color: #cbbeea; }

    @media (max-width: 600px) {
      .grid-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .block-1, .block-2, .block-3, 
      .block-4, .block-5, .block-6 {
        width: 100%;
        height: 100px;
      }

      .circles-container {
        flex-direction: column;
        gap: 10px;
        padding: 10px 0;
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="block-1"></div>
    <div class="block-2"></div>
    <div class="block-4"></div>
    <div class="block-5"></div>
    <div class="block-6"></div>
    <div class="block-3"></div>
    
    <div class="circles-container">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
      <div class="circle c4"></div>
    </div>
  </div>

</body>
</html>
