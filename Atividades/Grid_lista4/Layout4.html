<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1.2fr 1.5fr 0.4fr;
      grid-template-rows: 100px 100px 70px;
      gap: 12px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 650px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .block-1 { background-color: #f39c12; grid-column: 1; grid-row: 1; }
    .block-2 { background-color: #b0c4de; grid-column: 1; grid-row: 2; color: #333; }
    .block-4 { background-color: #f5b7b1; grid-column: 2; grid-row: 1 / span 2; color: #333; }
    .block-5 { background-color: #d1e8e2; grid-column: 3 / span 2; grid-row: 1; color: #333; }
    .block-6 { background-color: #a8c66c; grid-column: 3; grid-row: 2 / span 2; }
    .block-3 { background-color: #f4b41a; grid-column: 1 / span 2; grid-row: 3; }

    .circles-container {
      grid-column: 4;
      grid-row: 2 / span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    .circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .c1 { background-color: #e77647; }
    .c2 { background-color: #cca2a6; }
    .c3 { background-color: #b2c294; }
    .c4 { background-color: #cbbeea; }

    @media (max-width: 600px) {
      .grid-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        width: 100%;
        height: 80px;
      }

      .circles-container {
        flex-direction: row;
        width: 100%;
        padding: 10px 0;
      }
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <a href="https://en-wikipedia-org.translate.goog/wiki/World_Wide_Web?_x_tr_sl=en&_x_tr_tl=pt&_x_tr_hl=pt&_x_tr_pto=tc" class="card block-1">WEB</a>
    <a href="https://www.w3schools.com/html/default.asp" class="card block-2">HTML</a>
    <a href="https://www.w3schools.com/css/" class="card block-4">CSS</a>
    <a href="https://www.w3schools.com/css/css3_animations.asp" class="card block-5">Animate</a>
    <a href="https://www.w3schools.com/css/css_position.asp" class="card block-6">Position</a>
    <a href="https://www.w3schools.com/cssref/css3_pr_flex.php" class="card block-3">Flex</a>
    
    <div class="circles-container">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
      <div class="circle c4"></div>
    </div>
  </div>

</body>
</html>
